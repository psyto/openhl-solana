[workspace]
resolver = "2"
members = [
    "crates/state",
    "programs/openhl-core",
    "scripts/allocate-market",
    "scripts/create-market",
    "scripts/init-market",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/psyto/openhl-solana"
authors = ["psyto <saito.hiroyuki@gmail.com>"]

[workspace.dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
solana-sdk = "2.1"
solana-client = "2.1"
solana-program = "2.1"
solana-system-interface = "1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
