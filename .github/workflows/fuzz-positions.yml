# Fuzzes the Chapter 11 position handlers (OpenPosition, ClosePosition,
# Liquidate) with solinv on every pull request that touches the program, its
# crates or the harness: signer-skip, account-swap, and two sets that swap a
# whole second market's accounts. Fails on any finding.
# See docs/chapter-11-liquidation §11.7.
name: fuzz positions

on:
  pull_request:
    paths:
      - programs/openhl-core/**
      - crates/**
      - fuzz/positions/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/fuzz-positions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            ~/.cache/solana
          key: fuzz-tools-${{ runner.os }}-agave-4.1.2-crucible-v0.1.0

      - name: Install the Solana toolchain
        run: |
          if [ ! -x ~/.local/share/solana/install/active_release/bin/cargo-build-sbf ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install the Crucible CLI
        run: |
          command -v crucible || cargo install --locked \
            --git https://github.com/asymmetric-research/crucible --tag v0.1.0 crucible-fuzz-cli

      - name: Build the programs
        run: cargo build-sbf --manifest-path programs/openhl-core/Cargo.toml

      - name: Build the harness
        working-directory: fuzz/positions
        run: cargo build --release --features invariant_ch11

      - name: Test the attacks found so far
        working-directory: fuzz/positions
        run: cargo test --release --features invariant_ch11

      - name: Fuzz for 3 minutes
        working-directory: fuzz/positions
        run: |
          # crucible checks --timeout only every 1000 iterations, which is
          # many minutes at a harness's speed on ubuntu-latest
          # (asymmetric-research/crucible#25), so stop it from outside.
          set +e
          timeout -s INT -k 30 180 crucible run openhl_positions_fuzz invariant_ch11 \
            --binary-in target/release/invariant_test --timeout 180 > fuzz.log 2>&1
          rc=$?
          set -e
          tail -5 fuzz.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 130 ] && [ "$rc" -ne 137 ]; then
            echo "crucible exited $rc"; exit 1
          fi
          # crucible exits 0 even when it reports a finding.
          if grep -q '^\[FUZZ_FINDING\] \[' fuzz.log; then
            grep '^\[FUZZ_FINDING\] \[' fuzz.log | sort -u | head -20
            exit 1
          fi
          grep FUZZ_PULSE fuzz.log | tail -1
