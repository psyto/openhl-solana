[package]
name = "create-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Chapter 6 worked example: derives the (market, mint) vault PDA + vault-authority PDA and calls openhl-core::CreateVault, which CPIs to System::create_account (invoke_signed) then SPL Token InitializeAccount3 (invoke)."

[[bin]]
name = "create-vault"
path = "src/main.rs"

[dependencies]
openhl-core = { path = "../../programs/openhl-core", features = ["no-entrypoint"] }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
solana-program = { workspace = true }
solana-system-interface = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
