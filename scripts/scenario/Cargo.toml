[package]
name = "scenario"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sandbox scenario surface. Discovers, inspects, and walks through pre-baked openhl-solana scenarios. See fabrknt/website/SANDBOX-PATTERN.md for the cross-engine 5-element spec this implements."

[[bin]]
name = "scenario"
path = "src/main.rs"

[dependencies]
clap     = { workspace = true }
anyhow   = { workspace = true }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Used by the in-process account_layout_demo to inspect on-chain
# account layouts (sizes, discriminators, versions) without needing
# a validator or deployed program. State-crate-only, no Solana
# runtime dependency for this binary.
openhl-state = { path = "../../crates/state" }
