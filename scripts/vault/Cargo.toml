[package]
name = "vault"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Chapter 12 worked example: drives openhl-core's trading vault. --init binds a manager; --deposit mints shares; --withdraw burns shares; --update-nav reflects realized PnL. Default action dumps vault + (optional) per-depositor share state."

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
openhl-state = { path = "../../crates/state" }
openhl-core = { path = "../../programs/openhl-core", features = ["no-entrypoint"] }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
solana-program = { workspace = true }
solana-system-interface = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
