[package]
name = "openhl_fees_fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: Crucible pins its own Solana crates, which differ from the
# program's workspace.
[workspace]

[dependencies]
crucible-fuzzer = { git = "https://github.com/asymmetric-research/crucible", tag = "v0.1.0" }
crucible-test-context = { git = "https://github.com/asymmetric-research/crucible", tag = "v0.1.0" }

# solinv, installed the way its README tells anyone else to.
solinv-fuzz = { git = "https://github.com/psyto/solinv", rev = "1badc31aa4d68f38a0a6c731f61cc7d3bed5302e" }
solinv-core = { git = "https://github.com/psyto/solinv", rev = "1badc31aa4d68f38a0a6c731f61cc7d3bed5302e" }

solana-account = "3"
solana-keypair = "3"
solana-pubkey = "3"
solana-instruction = "3.1"
solana-signer = "3"

arbitrary = { version = "1", features = ["derive"] }
ctrlc = "3.4"
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }

[[bin]]
name = "invariant_test"
path = "src/main.rs"

[features]
invariant_ch13 = []
